<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Bóveda</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <button type="button" id="backBtn" class="icon-btn" aria-label="Atrás" hidden>&#8249;</button>
    <h1 class="topbar-title">Bóveda</h1>
    <button type="button" id="lockPill" class="pill" aria-label="Bóveda cerrada, toca para abrirla">
      <span class="dot" aria-hidden="true"></span>
      <span id="lockText">Cerrada</span>
    </button>
    <button type="button" id="lockBtn" class="btn btn-small btn-round" aria-label="Cerrar bóveda" hidden>
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>
      Cerrar
    </button>
  </header>

  <main id="view" class="view">
    <div class="loading" aria-label="Cargando"><span class="spinner"></span></div>
  </main>

  <section id="unlock" class="overlay" role="dialog" aria-modal="true" aria-labelledby="unlockTitle" hidden>
    <form id="unlockForm" class="overlay-card" novalidate>
      <div class="overlay-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1s3.1 1.39 3.1 3.1v2z"/></svg>
      </div>
      <h2 id="unlockTitle">Tu bóveda está cerrada</h2>
      <p class="overlay-text">Escribe tu contraseña maestra para abrirla.</p>
      <input id="unlockInput" class="input input-center" type="password" name="password"
             autocomplete="current-password" autocapitalize="off" spellcheck="false"
             placeholder="Contraseña maestra" aria-label="Contraseña maestra">
      <p id="unlockError" class="form-error" role="alert" hidden></p>
      <button id="unlockSubmit" type="submit" class="btn btn-primary btn-block">Abrir</button>
      <button id="unlockCancel" type="button" class="btn btn-plain btn-block">Cancelar</button>
    </form>
  </section>

  <section id="fatal" class="overlay" role="alertdialog" aria-labelledby="fatalText" hidden>
    <div class="overlay-card">
      <div class="overlay-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path fill="currentColor" d="M11 15h2v2h-2zm0-8h2v6h-2zm.99-5C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/></svg>
      </div>
      <p id="fatalText" class="fatal-text"></p>
      <button id="fatalAction" type="button" class="btn btn-primary btn-block" hidden></button>
    </div>
  </section>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Activa JavaScript para usar tu bóveda.</p></noscript>
</body>
</html>
